<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Davis Brooks">
  <!-- sRGB of DESIGN.md's oklch tokens (starlight, starlight-core). Literal oklch() is
       skipped because several favicon rasterizers don't parse it and drop fills silently. -->
  <!-- The star always leads and the ring always recedes, which means the pair inverts
       with the ground: on white the star is the darkest value, on the void the brightest. -->
  <style>
    :root { --star: #1b589e; --ring: #3578b8; }
    @media (prefers-color-scheme: dark) { :root { --star: #63b3ff; --ring: #3578b8; } }
  </style>
  <mask id="fix-cut">
      <rect width="32" height="32" fill="#fff" />
      <circle cx="23" cy="9.5" r="7.7" fill="#000" />
    </mask>
    <circle cx="15.5" cy="17" r="10.5" fill="none" stroke="var(--ring)" stroke-width="2.2" mask="url(#fix-cut)" />
    <path d="M23 2.7 C23 7.19 25.31 9.5 29.8 9.5 C25.31 9.5 23 11.81 23 16.3 C23 11.81 20.69 9.5 16.2 9.5 C20.69 9.5 23 7.19 23 2.7 Z" fill="var(--star)" />
</svg>
